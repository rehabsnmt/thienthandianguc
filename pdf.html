<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử Lý PDF - Thiên Thần Địa Ngục</title>
    
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff;
            --text-muted: #a0a0a0; --accent-color: #ff4757; --accent-hover: #ff6b81;
            --toolbar-bg: #2d2d2d;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 1000px; display: flex; align-items: center; margin-bottom: 2rem; }
        .back-btn { color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-right: auto; }
        h1 { font-size: 2rem; margin: 0; text-align: center; flex-grow: 1; margin-right: 80px; }

        .container { background-color: var(--card-bg); width: 100%; max-width: 1000px; border-radius: 12px; border-top: 4px solid var(--accent-color); overflow: hidden; position: relative; }

        /* MÀN HÌNH 1: UPLOAD */
        #uploadScreen { padding: 3rem; text-align: center; }
        .upload-area { border: 2px dashed #444; border-radius: 8px; padding: 3rem 2rem; cursor: pointer; transition: all 0.3s ease; display: block; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent-color); background-color: rgba(255, 71, 87, 0.05); }
        .upload-area input[type="file"] { display: none; }
        .upload-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }

        /* MÀN HÌNH 2: WORKSPACE */
        #workspaceScreen { display: none; flex-direction: column; }
        
        .toolbar { background-color: var(--toolbar-bg); padding: 1rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;}
        .tool-group { display: flex; gap: 10px; }
        .btn { background-color: #444; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background-color: #555; }
        .btn-primary { background-color: var(--accent-color); }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-warning { background-color: #f39c12; }
        .btn-warning:hover { background-color: #e67e22; }

        /* Lưới hiển thị trang */
        #previewGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding: 2rem; background-color: #1a1a1a; max-height: 60vh; overflow-y: auto; }
        
        .page-card { position: relative; background: #fff; padding: 5px; border-radius: 4px; cursor: pointer; transition: transform 0.2s; border: 3px solid transparent; display: flex; flex-direction: column; align-items: center;}
        .page-card.selected { border-color: var(--accent-color); }
        .page-card canvas { max-width: 100%; height: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .page-number { color: #000; font-size: 0.8rem; font-weight: bold; margin-top: 5px; }
        
        .selected-badge { position: absolute; top: -10px; right: -10px; background: var(--accent-color); color: white; width: 24px; height: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .page-card.selected .selected-badge { display: flex; }

        /* Nút Zoom hiện ra khi hover */
        .zoom-btn { position: absolute; bottom: 30px; background: rgba(0, 0, 0, 0.7); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; opacity: 0; transition: opacity 0.2s; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .page-card:hover .zoom-btn { opacity: 1; }
        .zoom-btn:hover { background: var(--accent-color); }

        /* MODAL PHÓNG TO */
        #zoomModal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; }
        #zoomModal.active { display: flex; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; }
        .close-modal:hover { color: var(--accent-color); }
        #zoomCanvas { max-width: 90%; max-height: 85vh; background: white; border-radius: 4px; }
        #zoomPageText { margin-top: 15px; font-size: 1.2rem; font-weight: bold; }

        #fileList { padding: 2rem; list-style: none; margin: 0; display: none; }
        .file-item { background-color: #252525; padding: 15px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #555; }
        
        #loadingMsg { text-align: center; padding: 2rem; display: none; color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">⬅ Trang chủ</a>
        <h1>Công Cụ PDF</h1>
    </div>

    <div class="container">
        <!-- SCREEN 1: UPLOAD -->
        <div id="uploadScreen">
            <label class="upload-area" id="dropZone">
                <span class="upload-icon">📄</span>
                <span style="font-size: 1.2rem; display: block; margin-bottom: 10px;">Nhấp hoặc kéo thả file PDF vào đây</span>
                <span style="color: var(--text-muted); font-size: 0.9rem;">Chọn 1 file để xem/tách, hoặc nhiều file để gộp</span>
                <input type="file" id="fileInput" accept="application/pdf" multiple>
            </label>
        </div>

        <!-- SCREEN 2: WORKSPACE -->
        <div id="workspaceScreen">
            <div class="toolbar">
                <div class="tool-group" id="singleFileTools" style="display: none;">
                    <button class="btn" id="btnSelectAll">Chọn tất cả</button>
                    <button class="btn" id="btnRotate">Xoay 90°</button>
                    <button class="btn btn-primary" id="btnExtract">Trích xuất</button>
                    <button class="btn btn-primary" id="btnDelete">Xóa trang</button>
                    <button class="btn btn-warning" id="btnPassword">🔒 Đặt mật khẩu</button>
                </div>
                <div class="tool-group" id="multiFileTools" style="display: none;">
                    <button class="btn btn-primary" id="btnMerge">Gộp tất cả file</button>
                </div>
                <button class="btn" id="btnReset" style="background: transparent; border: 1px solid #555;">Tải file khác</button>
            </div>
            
            <div id="loadingMsg">Đang tải bản xem trước... Vui lòng đợi.</div>
            <div id="previewGrid"></div>
            <ul id="fileList"></ul>
        </div>
    </div>

    <!-- MODAL PHÓNG TO ẢNH -->
    <div id="zoomModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <canvas id="zoomCanvas"></canvas>
        <div id="zoomPageText">Trang 1</div>
    </div>

    <script src="pdf.js"></script>
</body>
</html>
