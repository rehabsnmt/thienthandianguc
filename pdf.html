<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử Lý PDF - Thiên Thần Địa Ngục</title>
    
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent-color: #ef4444; --accent-hover: #f87171; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 1000px; display: flex; align-items: center; margin-bottom: 2rem; }
        .back-btn { color: var(--accent-color); text-decoration: none; font-weight: bold; font-size: 1.1rem; margin-right: auto; }
        h1 { font-size: 2rem; margin: 0; text-align: center; flex-grow: 1; margin-right: 80px; }

        .container { background: var(--card-bg); width: 100%; max-width: 1000px; border-radius: 12px; border-top: 4px solid var(--accent-color); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        /* BƯỚC 1: MÀN HÌNH CHỌN TÍNH NĂNG */
        #homeScreen { padding: 3rem; }
        .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 1.5rem; }
        .mode-card { background: #0f172a; border: 2px solid #334155; padding: 2rem 1rem; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .mode-card:hover { border-color: var(--accent-color); transform: translateY(-5px); background: rgba(239, 68, 68, 0.05); }
        .mode-icon { font-size: 3rem; margin-bottom: 10px; }
        .mode-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .mode-desc { font-size: 0.85rem; color: var(--text-muted); }

        /* BƯỚC 2: MÀN HÌNH UPLOAD */
        #uploadScreen { padding: 4rem 2rem; text-align: center; display: none; }
        .upload-area { border: 2px dashed #475569; border-radius: 12px; padding: 4rem 2rem; cursor: pointer; transition: 0.3s; display: block; background: #0f172a; }
        .upload-area:hover { border-color: var(--accent-color); background: rgba(239, 68, 68, 0.05); }
        .upload-area input { display: none; }

        /* BƯỚC 3: WORKSPACE */
        #workspaceScreen { display: none; flex-direction: column; }
        .toolbar { background: #334155; padding: 1rem 1.5rem; display: flex; gap: 10px; justify-content: space-between; align-items: center;}
        .tool-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { background: #475569; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn:hover { background: #64748b; }
        .btn-primary { background: var(--accent-color); }
        .btn-primary:hover { background: var(--accent-hover); }
        
        #previewGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; padding: 2rem; background: #0f172a; max-height: 65vh; overflow-y: auto; }
        .page-card { position: relative; background: #fff; padding: 6px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; text-align: center; }
        .page-card.selected { border-color: var(--accent-color); }
        .page-card canvas { width: 100%; height: auto; border-radius: 4px; border: 1px solid #ccc; transition: 0.3s;}
        .page-number { color: #1e293b; font-size: 0.85rem; font-weight: bold; margin-top: 8px; }
        .selected-badge { position: absolute; top: -10px; right: -10px; background: var(--accent-color); color: white; width: 24px; height: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; z-index: 10;}
        .page-card.selected .selected-badge { display: flex; }
        
        .zoom-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; opacity: 0; transition: 0.2s; }
        .page-card:hover .zoom-btn { opacity: 1; }
        .dragging { opacity: 0.5; }
        .drag-over { border-color: var(--accent-color); background: rgba(239, 68, 68, 0.1); }
        
        #loadingMsg { text-align: center; padding: 2rem; display: none; color: var(--accent-color); font-weight: bold; }

        /* MODAL ZOOM & ĐIỀU HƯỚNG */
        #zoomModal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; }
        #zoomModal.active { display: flex; }
        #closeModal { position: absolute; top: 15px; right: 25px; color: white; font-size: 40px; cursor: pointer; z-index: 1000;}
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: white; border: none; font-size: 2rem; padding: 1rem; cursor: pointer; border-radius: 8px; z-index: 1000;}
        .nav-btn:hover { background: var(--accent-color); }
        #btnPrevPage { left: 20px; } #btnNextPage { right: 20px; }
        #zoomCanvas { background: white; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #zoomPageText { margin-top: 15px; font-size: 1.2rem; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">⬅ Trang chủ</a>
        <h1>Công Cụ PDF</h1>
    </div>

    <div class="container">
        <!-- BƯỚC 1: CHỌN TÍNH NĂNG -->
        <div id="homeScreen">
            <h2 style="text-align: center; margin-top: 0; margin-bottom: 5px;">Bạn muốn làm gì?</h2>
            <p style="text-align: center; color: var(--text-muted);">Vui lòng chọn một tính năng để bắt đầu</p>
            <div class="mode-grid">
                <div class="mode-card" data-mode="merge">
                    <div class="mode-icon">📚</div>
                    <div class="mode-title">Gộp PDF</div>
                    <div class="mode-desc">Nối nhiều file thành một</div>
                </div>
                <div class="mode-card" data-mode="extract">
                    <div class="mode-icon">✂️</div>
                    <div class="mode-title">Tách PDF</div>
                    <div class="mode-desc">Trích xuất các trang đã chọn</div>
                </div>
                <div class="mode-card" data-mode="delete">
                    <div class="mode-icon">🗑️</div>
                    <div class="mode-title">Xóa Trang</div>
                    <div class="mode-desc">Loại bỏ các trang thừa</div>
                </div>
                <div class="mode-card" data-mode="rotate">
                    <div class="mode-icon">⟳</div>
                    <div class="mode-title">Xoay PDF</div>
                    <div class="mode-desc">Sửa lỗi trang bị ngược</div>
                </div>
                <!-- Vị trí để mở rộng tính năng Đặt Mật Khẩu API sau này nếu cần -->
            </div>
        </div>

        <!-- BƯỚC 2: UPLOAD -->
        <div id="uploadScreen">
            <button class="btn" id="btnBackHome" style="margin-bottom: 20px; background: transparent; border: 1px solid #475569;">⬅ Quay lại</button>
            <label class="upload-area" id="dropZone">
                <span class="upload-icon">📄</span>
                <span style="font-size: 1.3rem; font-weight: bold; display: block;" id="uploadTitle">Kéo thả file vào đây</span>
                <span style="color: var(--text-muted); font-size: 0.95rem;" id="uploadSub">...</span>
                <input type="file" id="fileInput" accept="application/pdf">
            </label>
        </div>

        <!-- BƯỚC 3: WORKSPACE -->
        <div id="workspaceScreen">
            <div class="toolbar">
                <div class="tool-group">
                    <button class="btn" id="btnSelectAll" style="display: none;">☑ Chọn tất cả</button>
                    <button class="btn" id="btnInvert" style="display: none;">⧭ Đảo chọn</button>
                    <button class="btn" id="btnActionRotate" style="display: none;">⟳ Xoay 90° (Các trang đã chọn)</button>
                </div>
                <div class="tool-group">
                    <button class="btn btn-primary" id="btnExecute">Thực Thi</button>
                    <button class="btn" id="btnCancel" style="background: transparent; border: 1px solid #94a3b8;">Hủy</button>
                </div>
            </div>
            <div id="loadingMsg">Đang xử lý...</div>
            <div id="previewGrid"></div>
        </div>
    </div>

    <!-- MODAL ZOOM -->
    <div id="zoomModal">
        <span id="closeModal">&times;</span>
        <button id="btnPrevPage" class="nav-btn">❮</button>
        <canvas id="zoomCanvas"></canvas>
        <button id="btnNextPage" class="nav-btn">❯</button>
        <div id="zoomPageText">Trang 1</div>
    </div>

    <script src="pdf.js"></script>
</body>
</html>
