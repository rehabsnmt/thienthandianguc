<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiên Thần Địa Ngục - Web Toolbox</title>
    <style>
        /* Cấu hình CSS cơ bản (Dark Theme) */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #ff4757; /* Màu đỏ làm điểm nhấn */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 3rem;
        }

        #searchInput {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 2px solid #333;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        #searchInput:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.2);
        }

        /* Lưới hiển thị các tính năng */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .feature-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            border-left: 4px solid var(--accent-color);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            background-color: #252525;
        }

        .feature-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .feature-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-grow: 1;
            line-height: 1.5;
        }

        .status-badge {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            align-self: flex-start;
        }

        .status-completed { background-color: #2ed573; color: #000; }
        .status-dev { background-color: #ffa502; color: #000; }
    </style>
</head>
<body>

    <h1>Thiên Thần Địa Ngục</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Tìm kiếm công cụ... (VD: pdf, ảnh, dashboard)">
    </div>

    <!-- Container này sẽ được JS lấp đầy dữ liệu -->
    <div class="features-grid" id="featuresList"></div>

    <script src="app.js"></script>
</body>
</html>
